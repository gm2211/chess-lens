name: ChessLens
options:
  bundleIdPrefix: app.chesslens
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
packages:
  ChessCore:
    path: Packages/ChessCore
  BoardVision:
    path: Packages/BoardVision
  KokoroTTS:
    path: Packages/KokoroTTS
  VoiceKit:
    path: Packages/VoiceKit
targets:
  ChessLens:
    type: application
    platform: macOS
    sources:
      - path: ChessLens
        excludes:
          - Resources/Stockfish.entitlements
          - Resources/Sidecar.entitlements
          - Resources/AppIcon-1024.png
    dependencies:
      - package: ChessCore
      - package: BoardVision
      - package: KokoroTTS
      - package: VoiceKit
    info:
      path: ChessLens/Info.plist
      properties:
        CFBundleDisplayName: Étude
        CFBundleName: Étude
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.board-games
        NSHumanReadableCopyright: "Étude. Includes Stockfish 18 (GPLv3), see Stockfish-Copying.txt, and sherpa-onnx (Apache-2.0) to run the optional, downloadable Kokoro-82M voice (Apache-2.0)."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Portable Game Notation
            CFBundleTypeRole: Viewer
            CFBundleTypeExtensions: [pgn]
            LSHandlerRank: Alternate
    entitlements:
      path: ChessLens/ChessLens.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chesslens.ChessLens
        PRODUCT_NAME: Etude
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Apple Intelligence (macOS 26+) is only touched behind #available; weak-link so macOS 14 still launches.
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
        # sherpa-onnx + onnxruntime static libraries for the Kokoro voice (scripts/fetch-kokoro.sh). The model itself is
        # not bundled: users download it from Settings > Voice (Narration/VoiceLibrary.swift, Packages/VoiceKit).
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/vendor/kokoro/lib"
    preBuildScripts:
      - name: Check Kokoro libraries
        basedOnDependencyAnalysis: false
        script: |
          [ -f "${SRCROOT}/vendor/kokoro/lib/libsherpa-onnx-c-api.a" ] || { echo "error: the sherpa-onnx libraries are missing at ${SRCROOT}/vendor/kokoro/lib. Run mac/scripts/fetch-kokoro.sh first." >&2; exit 1; }
    postCompileScripts:
      - name: Embed Stockfish
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/embed-stockfish.sh"
      - name: Embed LLM sidecar
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/embed-sidecar.sh"
